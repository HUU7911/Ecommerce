spring:
  application:
    name: server
  # Elasticsearch
  ssl:
    bundle:
      pem:
        elastic:
          truststore:
            certificate: ${SSL}
  elasticsearch:
    uris: https://localhost:9200
    username: elastic
    password: ${ELASTIC_PASSWORD}
    restclient:
      ssl:
        bundle: elastic
    data:
      elasticsearch:
        repositories:
          enabled: true
  # Open feign
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: product-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.meal.product.event"
  # Mongo db
  mongodb:
    uri: ${MOGO_URL}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  # Postgres
  datasource:
    url: ${URL}
    username: postgres
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

# Server config
server:
  port: 8080
  servlet:
    context-path: /ecommerce

# Jwt
jwt:
  signerKey: ${SIGNER_KEY}
  valid-duration: ${VALID_DURATION}
  refreshable-duration: ${REFRESHABLE_DURATION}

# Brevo
brevo:
  url: ${BREVO_URL}
  api-key: ${API_KEY_BREVO}

app:
  file:
    download-prefix: "http://localhost:8888/api/v1/file/media/download/"

# MinIO
minio:
  config:
    endpoint: ${ENDPOINT}
    accessKey: ${ACCESS_KEY}
    secretKey: ${SECRET_KEY}
    bucket: ${BUCKET}

logging:
  level:
    org.hibernate.orm.connections.pooling: WARN