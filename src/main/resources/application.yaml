spring:
  application:
    name: Ecommerce
  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: product-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.meal.product.event"
  # Mongo db
  mongodb:
    uri: ${MOGO_URL}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  # Postgres
  datasource:
    url: ${URL}
    username: postgres
    password: ${PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

server:
  port: 8080
  servlet:
    context-path: /ecommerce

jwt:
  signerKey: ${SIGNER_KEY}
  valid-duration: ${VALID_DURATION}
  refreshable-duration: ${REFRESHABLE_DURATION}

brevo:
  url: ${BREVO_URL}
  api-key: ${API_KEY_BREVO}

app:
  file:
    download-prefix: "http://localhost:8888/api/v1/file/media/download/"

minio:
  config:
    endpoint: ${ENDPOINT}
    accessKey: ${ACCESS_KEY}
    secretKey: ${SECRET_KEY}
    bucket: ${BUCKET}